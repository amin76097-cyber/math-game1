<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت بازی ریاضی</title><style>body{font-family:Tahoma,Arial;background:#071126;color:#fff;margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;color:#14213d;border-radius:20px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef4ff;border-radius:15px;padding:15px;text-align:center}.stat b{font-size:25px;display:block}input,select,button{font:inherit;padding:11px;border-radius:12px;border:1px solid #ccd6e3;margin:4px}button{background:#2563eb;color:#fff;border:0;cursor:pointer}.danger{background:#dc2626}.hide{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><h1>📊 پنل مدیریت بازی ریاضی چهارم</h1><div id="login" class="card"><h2>ورود مدیر</h2><input id="email" type="email" placeholder="ایمیل مدیر"><input id="pass" type="password" placeholder="رمز مدیر"><button onclick="login()">ورود</button><p id="msg"></p></div><div id="dash" class="hide"><div class="card"><button class="danger" onclick="logout()">خروج</button><select id="school" onchange="load()"><option value="">همه مدارس</option><option>دبستان سلام2</option><option>شهید فهمیده</option></select><button onclick="csv()">دریافت CSV</button></div><div class="grid"><div class="stat">دانش‌آموزان<b id="students">-</b></div><div class="stat">تلاش‌ها<b id="attempts">-</b></div><div class="stat">میانگین امتیاز<b id="avg">-</b></div><div class="stat">آخرین ثبت<b id="last">-</b></div></div><div class="card"><h2>دانش‌آموزان و عملکرد</h2><table><thead><tr><th>نام</th><th>مدرسه</th><th>تلاش‌ها</th><th>بهترین امتیاز</th><th>میانگین</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const SUPABASE_URL='https://zimqkgvaybgjdhmaooln.supabase.co';const KEY='secret-8e3f7721';const sb=supabase.createClient(SUPABASE_URL,KEY);let data=[];async function login(){const {data:d,error}=await sb.auth.signInWithPassword({email:email.value,password:document.getElementById('pass').value});if(error){msg.textContent='ورود ناموفق: '+error.message;return}const {data:a,error:e}=await sb.from('admins').select('email').eq('email',d.user.email).maybeSingle();if(e||!a){await sb.auth.signOut();msg.textContent='این حساب مدیر نیست.';return}loginBox(false);await load()}function loginBox(show){document.getElementById('login').classList.toggle('hide',!show);document.getElementById('dash').classList.toggle('hide',show)}async function load(){const {data:st,error:e}=await sb.from('students').select('id,full_name,school_id,schools(name)').order('created_at',{ascending:false});if(e){alert(e.message);return}const {data:at,error:x}=await sb.from('attempts').select('*').order('created_at',{ascending:false});if(x){alert(x.message);return}let school=school.value;let students=st.filter(s=>!school||s.schools?.name===school);let ids=new Set(students.map(s=>s.id));let ats=at.filter(a=>ids.has(a.student_id));data=students.map(s=>{let aa=ats.filter(a=>a.student_id===s.id);return {name:s.full_name,school:s.schools?.name||'',attempts:aa.length,best:aa.length?Math.max(...aa.map(a=>a.score||0)):0,avg:aa.length?Math.round(aa.reduce((q,a)=>q+(Number(a.percentage)||0),0)/aa.length):0}});studentsEl.textContent=students.length;attemptsEl.textContent=ats.length;avgEl.textContent=ats.length?Math.round(ats.reduce((q,a)=>q+(Number(a.percentage)||0),0)/ats.length)+'%':'-';lastEl.textContent=ats.length?new Date(ats[0].created_at).toLocaleDateString('fa-IR'):'-';rows.innerHTML=data.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.school)}</td><td>${r.attempts}</td><td>${r.best}</td><td>${r.avg}%</td></tr>`).join('')}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function logout(){await sb.auth.signOut();loginBox(true)}function csv(){let h='نام,مدرسه,تلاش‌ها,بهترین امتیاز,میانگین
';let b=data.map(r=>[r.name,r.school,r.attempts,r.best,r.avg].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('
');let a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob(['﻿'+h+b],{type:'text/csv'}));a.download='گزارش-بازی-ریاضی.csv';a.click()}const studentsEl=document.getElementById('students'),attemptsEl=document.getElementById('attempts'),avgEl=document.getElementById('avg'),lastEl=document.getElementById('last'),rows=document.getElementById('rows');</script></body></html>
